<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Signal Lost</title>
    <style>
        :root {
            --bg-color: #e0e5ec;
            --shadow-light: rgba(255, 255, 255, 0.7);
            --shadow-dark: rgba(163, 177, 198, 0.6);
            --text-main: #4a4a4a;
            --macro-color: #2d98da;
            --mini-color: #fc5c65;
        }

        /* Mencegah seleksi teks dan copy-paste */
        * {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            color: var(--text-main);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .neu-card {
            background: var(--bg-color);
            border-radius: 32px;
            padding: 60px 50px;
            box-shadow: 12px 12px 24px var(--shadow-dark), -12px -12px 24px var(--shadow-light);
            text-align: center;
            max-width: 650px;
            width: 100%;
        }

        .icon-circle {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: var(--bg-color);
            box-shadow: inset 6px 6px 12px var(--shadow-dark), inset -6px -6px 12px var(--shadow-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 56px;
        }

        .error-code {
            font-size: 6rem;
            font-weight: bold;
            margin: 0;
            color: var(--mini-color);
            line-height: 1;
            letter-spacing: -2px;
        }

        h1 {
            font-size: 2rem;
            margin: 22px 0 14px;
            font-weight: 700;
        }

        p {
            font-size: 1.15rem;
            opacity: 0.85;
            margin: 0;
            line-height: 1.6;
        }
    </style>
</head>
<body oncontextmenu="return false" oncopy="return false" oncut="return false" ondragstart="return false">

    <div class="neu-card">
        <div class="icon-circle">📡</div>
        <h2 class="error-code">404</h2>
        <h1>Signal Lost / Under Maintenance</h1>
        <p>Halaman atau Tower ID yang Anda cari tidak ditemukan atau sedang dalam perbaikan jaringan.</p>
    </div>

</body>
</html>
