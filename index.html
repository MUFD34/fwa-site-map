<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWA Site Map</title>
    
    <!-- MENAMBAHKAN ICON MAP.PNG -->
    <link rel="icon" type="image/png" href="map.png">

    <!-- Import Leaflet CSS untuk Peta -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Menghubungkan ke file CSS buatanmu -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar: Neu-Bento -->
        <div class="neu-card sidebar">
            <h2>🛰️ Network Overview</h2>
            <p class="subtitle">Live status infrastruktur telekomunikasi.</p>
            
            <div class="stat-box">
                <h3 class="macro-text">Macro Sites</h3>
                <p class="stat-number macro-text" id="count-macro">42</p>
            </div>
            
            <div class="stat-box">
                <h3 class="mini-text">Minimacro Sites</h3>
                <p class="stat-number mini-text" id="count-mini">128</p>
            </div>
            
            <!-- FITUR BARU: Filter Buttons -->
            <div style="margin-top: 10px; margin-bottom: 20px;">
                <h3 style="font-size: 1rem; margin-bottom: 15px; text-align: center;">Filter Site</h3>
                <div class="filter-buttons">
                    <button class="neu-btn active" data-filter="All">All</button>
                    <button class="neu-btn" data-filter="Macro">Macro</button>
                    <button class="neu-btn" data-filter="Minimacro">Mini</button>
                    <button class="neu-btn" data-filter="Maintenance">Down</button>
                </div>
            </div>
            
            <div class="status-footer">
                Auto-refresh: Active
            </div>
        </div>

        <!-- Main Content: Map & Glassmorphism -->
        <div class="neu-card map-wrapper">
            <div id="map"></div>
            
            <!-- Glassmorphism Legend -->
            <div class="glass-panel">
                <h4>Legenda Jaringan</h4>
                <div class="legend-item"><span class="dot bg-macro"></span> Macro (Aktif)</div>
                <div class="legend-item"><span class="dot bg-mini"></span> Minimacro (Aktif)</div>
                <div class="legend-item"><span class="dot bg-maintenance"></span> Maintenance</div>
            </div>
        </div>
    </div>

    <!-- Import Leaflet JS untuk fungsi Peta -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Menghubungkan ke file JS buatanmu (ditaruh di bawah agar HTML dimuat duluan) -->
    <script src="script.js"></script>
</body>
</html>
