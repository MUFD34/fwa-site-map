<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FWA Site Map</title>
    <link rel="icon" type="image/png" href="map.png">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="dashboard-container">
        <!-- Sidebar -->
        <div class="neu-card sidebar">
            <h2>🛰️ Network Overview</h2>
            <p class="subtitle">Live status infrastruktur telekomunikasi.</p>
            
            <!-- Animated Drag & Drop Zone -->
            <div class="drag-drop-zone" id="drop-zone">
                <input type="file" id="excel-upload" accept=".xlsx, .xls, .csv" hidden />
                <div class="drop-content" id="drop-content">
                    <span class="upload-icon">📂</span>
                    <p style="margin: 10px 0; font-size: 13px;"><b>Drag & Drop</b> file Excel Anda di sini<br>atau klik untuk mencari file.</p>
                    <p id="upload-status" style="font-size: 11px; margin: 0; color: #7f8c8d;"></p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-container">
                <input type="text" id="search-input" class="neu-input" placeholder="🔍 Cari Tower ID / EMR ID...">
            </div>

            <!-- Statistik -->
            <div class="stats-grid">
                <div class="stat-box">
                    <h3 class="macro-text" style="font-size: 11px; margin-bottom: 5px;">Macro</h3>
                    <p class="stat-number macro-text" id="count-macro">0</p>
                </div>
                <div class="stat-box">
                    <h3 class="mini-text" style="font-size: 11px; margin-bottom: 5px;">Minimacro</h3>
                    <p class="stat-number mini-text" id="count-mini">0</p>
                </div>
                <div class="stat-box">
                    <h3 class="notyet-text" style="font-size: 11px; margin-bottom: 5px;">Not Yet</h3>
                    <p class="stat-number notyet-text" id="count-notyet">0</p>
                </div>
            </div>
            
            <!-- Filter Dropdowns -->
            <div class="filters-container">
                <h3 style="font-size: 0.95rem; margin-bottom: 10px;">Filter Spesifik</h3>
                
                <select id="filter-type" class="neu-select">
                    <option value="All">📡 Semua Tipe Site</option>
                    <option value="Macro">Macro</option>
                    <option value="Minimacro">Minimacro</option>
                    <option value="Not Yet">Not Yet</option>
                </select>

                <select id="filter-provinsi" class="neu-select">
                    <option value="All">📍 Semua Provinsi</option>
                </select>

                <select id="filter-kota" class="neu-select">
                    <option value="All">🏙️ Semua Kab/Kota</option>
                </select>

                <select id="filter-vendor" class="neu-select">
                    <option value="All">🏢 Semua Vendor</option>
                </select>
            </div>
        </div>

        <!-- Main Content -->
        <div class="neu-card map-wrapper">
            <div id="map"></div>
            
            <div class="glass-panel">
                <h4>Legenda Jaringan</h4>
                <div class="legend-item"><span class="dot bg-macro"></span> Macro</div>
                <div class="legend-item"><span class="dot bg-mini"></span> Minimacro</div>
                <div class="legend-item"><span class="dot bg-notyet"></span> Not Yet</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
